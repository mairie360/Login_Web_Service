# yaml-language-server: $schema=https://raw.githubusercontent.com/mairie360/CICD/main/tests/a11y/rgaa.schema.json
# RGAA 4.1.2 scope of the login front (MAIR-316), checked by the RGAA job of mairie360/CICD
# frontend-cicd.yml in release-prod, on the staging-<sha> image (format: CICD README, "RGAA scope").
version: 1
target: http://login-front:5000

# Same JWT_SECRET as the services of docker-compose-accessibility.yml. The login page is public:
# no state logs in, the session is only needed by the other fronts.
session:
  jwt_secret: b"secret"

criteria:
  # Images: the logo (informative). 1.2: no decorative image; 1.4-1.9: no CAPTCHA, chart,
  # image of text (the logo is exempt) or figure caption.
  - "1.1"
  - "1.3"
  # 2.x: no frame. 4.x: no media. 5.x: no table.
  - "3.1"
  - "3.2"
  - "3.3"
  # 6.1, 6.2, 10.6: no link yet; they come with the legal pages (MAIR-292). The run fails if a link
  # appears before they are declared.
  - "7.1"
  - "7.3"
  - "7.5"
  # 7.2: no script with an alternative; 7.4: the redirection follows an explicit submit.
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"
  - "8.5"
  - "8.6"
  - "8.9"
  # 8.7, 8.8: no text in another language; 8.10: no right-to-left text.
  - "9.1"
  - "9.2"
  # 9.3: no list; 9.4: no quotation.
  - "10.1"
  - "10.2"
  - "10.3"
  - "10.4"
  - "10.5"
  - "10.7"
  - "10.8"
  - "10.9"
  - "10.10"
  - "10.11"
  - "10.12"
  # 10.13, 10.14: no content shown on hover or focus.
  - "11.1"
  - "11.2"
  - "11.3"
  - "11.4"
  - "11.9"
  - "11.10"
  - "11.11"
  - "11.12"
  - "11.13"
  # 11.5-11.8: no group of fields nor list of choices.
  # 12.1-12.5: a single standalone page, no navigation system, site map or search;
  # 12.10: no keyboard shortcut; 12.11: no content shown on hover.
  - "12.6"
  - "12.7"
  - "12.8"
  - "12.9"
  # 13.1: no time limit; 13.2: no new window; 13.3-13.8: no document, cryptic or moving content.
  - "13.9"
  - "13.11"
  # 13.10, 13.12: no complex gesture nor device motion.

states:
  - id: login
    route: /
  - id: login-empty-submit
    description: Form submitted empty (browser validation of the required fields)
    route: /
    steps:
      - click: { role: button, name: Se connecter }
  - id: login-wrong-credentials
    description: Error message after a refused login (unknown account)
    route: /
    steps:
      - fill: { label: Email professionnel, value: inconnu@mairie360.fr }
      - fill: { label: Mot de passe, value: wrong-password }
      - click: { role: button, name: Se connecter }
      # The request is over when the button reads "Se connecter" again (it shows "Connexion…"
      # meanwhile); the error region (role="alert") exists, empty, from the start.
      - wait_for: { role: button, name: Se connecter, exact: true }
  - id: login-password-change
    description: Forced password change (bff-user answers 412 for the seed user 2)
    route: /
    steps:
      - fill: { label: Email professionnel, value: perf-tester@mairie360.fr }
      - fill: { label: Mot de passe, value: any-password }
      - click: { role: button, name: Se connecter }
      - wait_for: { label: Nouveau mot de passe }
