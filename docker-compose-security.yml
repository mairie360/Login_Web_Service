# Stack de test de sécurité dynamique (DAST) ISOLÉE pour le front Login (Login_Web_Service).
#
#   ./security_test.sh            (local, NODE_AUTH_TOKEN exporté pour le build)
#   docker compose -f docker-compose-security.yml up --build \
#       --abort-on-container-exit --exit-code-from security-scan   (CI)
#
# security-scan (OWASP ZAP baseline) explore l'application Next.js servie par
# l'image de production (Dockerfile, sortie standalone) avec un cookie de session
# accessToken valide (replacer), comme un navigateur authentifié : pages, assets,
# en-têtes HTTP et routes relayées vers BFF User. Sort en échec sur toute alerte
# WARN/FAIL non neutralisée dans .zap/rules.tsv (les alertes informatives y sont
# passées à IGNORE).

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF User, seul BFF de ce front, puis à Core API.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-90c22bb}
    container_name: login-front-sec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-90c22bb}
    container_name: login-front-sec-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: login-front-sec-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: login-front-sec-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-95531e2}
    container_name: login-front-sec-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # Core API >= 2.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: login-front-sec-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:dev-46a698b}
    container_name: login-front-sec-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
      # The scanners replay the auth routes from one IP with invalid credentials on purpose: the
      # auth rate limits of BFF User (MAIR-226) would answer 429 and hide the real responses.
      AUTH_RATE_LIMIT_ENABLED: "false"
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: login-front-sec-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  login-front:
    image: ${TARGET_IMAGE:-login-front:security}
    container_name: login-front-sec-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      BFF_USER_API_URL: http://bff-user:4000
      # The production image refuses to issue the session cookie without a domain (503), and the
      # authentication routes only accept requests whose Origin is this front (403 otherwise).
      COOKIE_DOMAIN: login-front
      LOGIN_FRONT_URL: http://login-front:5000
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  security-scan:
    image: zaproxy/zap-stable
    container_name: login-front-sec-zap
    depends_on:
      login-front:
        condition: service_healthy
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
      - ./.zap/recovery-hooks.py:/zap/wrk/recovery-hooks.py:ro
    # zap-baseline.py: spider + passive scan (fit for a web UI, where the BFFs replay
    #   their OpenAPI with zap-api-scan.py).
    # -j: the AJAX spider renders the page in a headless browser and follows the fetch()
    #   calls of the client bundle, so the BFF contract routes and the /api/auth/* routes the UI really
    #   uses are scanned too; the classic spider only sees server-rendered links (MAIR-516).
    # -c rules.tsv : les alertes informatives sont passées à IGNORE, toute autre
    #   alerte (WARN/FAIL) fait sortir zap-baseline.py en code != 0.
    # -z ... replacer : injecte le cookie accessToken (JWT HS256 statique sub=2,
    #   role=user, exp=2100, signé avec JWT_SECRET=b"secret") sur chaque requête,
    #   le proxy same-origin le convertit en Authorization: Bearer vers le BFF.
    command:
      - zap-baseline.py
      - --hook=/zap/wrk/recovery-hooks.py
      - -t
      - http://login-front:5000/
      - -m
      - "3"
      - -j
      - -c
      - rules.tsv
      - -z
      - "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=accessToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwicm9sZSI6InVzZXIiLCJleHAiOjQxMDI0NDQ4MDB9.qjXr3pV4v8hvkbv_ufmNqaPqhDTbOGfTUeEXxa1z70U"
    networks:
      - backend
