name: Login Web Service CICD

on:
  # MAIR-436: branch pushes are covered by their pull_request run; only main
  # (which releases) runs on push, so a PR branch no longer runs the pipeline twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# MAIR-436: read-only token by default; write scopes are granted to the release job only.
permissions:
  contents: read

jobs:
  # #139: preserve the required legacy name with BOTH real blocking scanners.
  # Never emit synthetic success or remove/bypass the required status.
  required_security_scan:
    name: CICD / Code Security Audit (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout frontend history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed scanner actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mairie360/CICD
          ref: 16c63d21eedbf6c6e3b58ebc30c61231e49e2536 # main 2026-10-12 (MAIR-510, MAIR-516)
          path: cicd-repo
          persist-credentials: false
      - name: Run blocking Semgrep scan
        uses: ./cicd-repo/actions/frontend-semgrep-pypi
        with:
          config: p/typescript p/react p/owasp-top-ten p/secrets p/dockerfile p/github-actions
          fail_on_findings: "true"
          artifact_name: semgrep-required-check-sarif
      - name: Run blocking redacted Gitleaks scan
        uses: ./cicd-repo/actions/frontend-gitleaks
        with:
          fail_on_findings: "true"

  CICD:
    # A reusable workflow cannot exceed its caller job's scopes: release-dev
    # (packages, id-token for cosign) and release-prod (contents for the tag) need them.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: mairie360/CICD/.github/workflows/frontend-cicd.yml@16c63d21eedbf6c6e3b58ebc30c61231e49e2536
    with:
      package_name: "login-front"
      node_version: "24.21.0"
      cicd_version: "16c63d21eedbf6c6e3b58ebc30c61231e49e2536"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
