name: Login Web Service CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  CICD:
    uses: mairie360/CICD/.github/workflows/frontend-cicd.yml@v3.1.1
    with:
      package_name: "login-front"
      node_version: "24"
      cicd_version: "v3.1.1"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
