name: Login Web Service CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # #139: preserve the required legacy name with BOTH real blocking scanners.
  # Never emit synthetic success or remove/bypass the required status.
  required_security_scan:
    name: CICD / Code Security Audit (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout frontend history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed scanner actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mairie360/CICD
          ref: f5ea4257ac51aa2969f9ddb84730fbebce8f42a7 # published v4.0.1
          path: cicd-repo
          persist-credentials: false
      - name: Run blocking Semgrep scan
        uses: ./cicd-repo/actions/frontend-semgrep-pypi
        with:
          config: p/typescript p/react p/owasp-top-ten p/secrets p/dockerfile p/github-actions
          fail_on_findings: "true"
          artifact_name: semgrep-required-check-sarif
      - name: Run blocking redacted Gitleaks scan
        uses: ./cicd-repo/actions/frontend-gitleaks
        with:
          fail_on_findings: "true"

  CICD:
    uses: mairie360/CICD/.github/workflows/frontend-cicd.yml@f5ea4257ac51aa2969f9ddb84730fbebce8f42a7
    with:
      package_name: "login-front"
      node_version: "24.21.0"
      cicd_version: "f5ea4257ac51aa2969f9ddb84730fbebce8f42a7"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
