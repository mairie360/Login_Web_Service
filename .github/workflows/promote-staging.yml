name: Promote to Staging

# MAIR-494: manual promotion of a commit of main to staging (mairie360/CICD promote-staging.yml).
# `gh workflow run promote-staging.yml` (add `-f sha=SHA` for a given commit); the Staging environment approval still applies.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to promote (empty: main's newest commit)"
        required: false
        type: string

permissions:
  contents: read

# One promotion at a time per repo and target.
concurrency:
  group: promote-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: read
      packages: write
      actions: read
    uses: mairie360/CICD/.github/workflows/promote-staging.yml@d667cc1bb6c03356ac23ce4b079b51eb3e76d35e # v5.15.0
    with:
      stack: fronts
      package_name: login-front
      cicd_version: "d667cc1bb6c03356ac23ce4b079b51eb3e76d35e" # v5.15.0
      sha: ${{ inputs.sha }}
    secrets:
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
