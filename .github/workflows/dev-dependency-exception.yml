name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@bbd2207256969f9f63e5477452d86e1f6c56339d
    with:
      package_name: login-front
      cicd_ref: bbd2207256969f9f63e5477452d86e1f6c56339d
      node_version: "24.21.0"
      reason: ${{ inputs.reason }}
