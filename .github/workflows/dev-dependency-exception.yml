name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@34889930cf42b20020d2e2f702a566ef7ebca1ec # v5.3.1
    with:
      package_name: login-front
      cicd_ref: 34889930cf42b20020d2e2f702a566ef7ebca1ec # v5.3.1
      node_version: "24.22.1"
      reason: ${{ inputs.reason }}
