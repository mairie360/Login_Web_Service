name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@1ae67f5bca5dbde5946cfdd5d1a17e5a8c19f3f3 # v5.3.0
    with:
      package_name: login-front
      cicd_ref: 1ae67f5bca5dbde5946cfdd5d1a17e5a8c19f3f3 # v5.3.0
      node_version: "24.22.1"
      reason: ${{ inputs.reason }}
