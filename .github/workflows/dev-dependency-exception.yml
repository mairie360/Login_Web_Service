name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@e314bc0c41ed45157cdd928c25358fee82b0c4f6 # v5.1.0
    with:
      package_name: login-front
      cicd_ref: e314bc0c41ed45157cdd928c25358fee82b0c4f6 # v5.1.0
      node_version: "24.22.1"
      reason: ${{ inputs.reason }}
