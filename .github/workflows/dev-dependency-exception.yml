name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@c94b8ec6270dbcb842ad0a7ec81e6f5be55f3f6c # v4.3.2
    with:
      package_name: login-front
      cicd_ref: c94b8ec6270dbcb842ad0a7ec81e6f5be55f3f6c # v4.3.2
      node_version: "24.21.0"
      reason: ${{ inputs.reason }}
