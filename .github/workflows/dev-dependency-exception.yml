name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@2c88c172de2f340793ebb94c974b6afaacb3fbb8 # v4.3.3
    with:
      package_name: login-front
      cicd_ref: 2c88c172de2f340793ebb94c974b6afaacb3fbb8 # v4.3.3
      node_version: "24.21.0"
      reason: ${{ inputs.reason }}
